name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Repository policy (docs & secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-tracked-files.mjs

  web:
    name: Web lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    name: API tests (Testcontainers) and image build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: apps/api/build/reports/tests
      - run: docker build -t popspot-api:ci .

  e2e:
    name: E2E on the Docker stack
    runs-on: ubuntu-latest
    needs: [web, api]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      DEV_AUTH_ISSUER: popspot-dev
      AUTH_ISSUER: popspot-dev
    steps:
      - uses: actions/checkout@v4
      - name: Generate a throwaway dev-login secret shared by Spring and Next
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "AUTH_JWT_SECRET=$secret" >> "$GITHUB_ENV"
          echo "DEV_AUTH_JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Start PostgreSQL and Spring
        run: |
          docker compose up -d --build
          for _ in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && exit 0; sleep 2; done
          docker compose logs api | tail -50
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Playwright (installed Google Chrome)
        run: npx playwright test
        working-directory: apps/web
        env:
          E2E_API_BASE_URL: http://localhost:8080
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
      - if: always()
        run: docker compose down -v
