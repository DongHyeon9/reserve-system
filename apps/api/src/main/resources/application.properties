spring.application.name=api
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
popspot.auth.issuer=${AUTH_ISSUER:}
popspot.auth.jwks-uri=${AUTH_JWKS_URI:}
popspot.auth.jwt-secret=${AUTH_JWT_SECRET:}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
