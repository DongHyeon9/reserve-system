spring.application.name=api
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
popspot.auth.issuer=${AUTH_ISSUER:}
popspot.auth.jwks-uri=${AUTH_JWKS_URI:}
popspot.auth.jwt-secret=${AUTH_JWT_SECRET:}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
popspot.auth.dev-issuer=${DEV_AUTH_ISSUER:}
popspot.auth.dev-jwt-secret=${DEV_AUTH_JWT_SECRET:}
# Dev seed data is V1000, so later schema versions (V3, V4…) must be allowed to apply after it. Only set with the seed.
spring.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:false}
# SANDBOX operations tests (load / concurrent booking / latency / fault on synthetic data). Refused with the prod profile.
popspot.ops-tests.enabled=${OPS_TESTS_ENABLED:false}
# Readiness fails while the database is unreachable (uptime check + deploy smoke test see it); liveness stays
# independent of the DB so a DB outage does not trigger container restart loops.
management.endpoint.health.group.readiness.include=readinessState,db
# Supabase session pooler allows 15 clients per project in total (prod instances + rolling deploy + local api:dev).
# Keep each process small; DB_POOL_SIZE raises it where the database has no such cap (local Docker, tests).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=60000
