# Production profile (Cloud Run). Dev-only switches are forced off here; startup fails if a dev secret is still set.
popspot.ops-tests.enabled=false
springdoc.api-docs.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.shutdown=graceful
# One JSON object per line for Cloud Logging; requestId comes from RequestIdFilter via MDC.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=popspot-api
