# Pin every auth setting so tests never pick up a developer's local .env.
popspot.auth.issuer=popspot-test
popspot.auth.jwt-secret=test-only-secret-0123456789abcdef0123456789
popspot.auth.jwks-uri=
popspot.auth.dev-issuer=
popspot.auth.dev-jwt-secret=
springdoc.api-docs.enabled=true
spring.flyway.locations=classpath:db/migration
popspot.ops-tests.enabled=true
popspot.ops-tests.cleanup-interval-ms=3600000
spring.datasource.hikari.maximum-pool-size=10
