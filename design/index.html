<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Popspot 팝업스토어 예약 서비스 디자인 프로토타입" />
    <title>Popspot 디자인 프로토타입</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=Noto+Sans+KR:wght@400..900&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">본문으로 건너뛰기</a>
    <aside class="prototype-bar" aria-label="프로토타입 화면 선택">
      <a class="prototype-brand" href="#home" aria-label="Popspot 디자인 홈">
        <span class="prototype-dot"></span> Popspot Design
      </a>
      <label for="screen-select">화면 바로가기</label>
      <select id="screen-select">
        <optgroup label="고객 화면">
          <option value="home">01 홈</option>
          <option value="popups">02 팝업 탐색</option>
          <option value="popup-detail">03 팝업 상세</option>
          <option value="popup-waiting">04 예약 오픈 대기</option>
          <option value="auth">05 로그인·가입</option>
          <option value="reserve">06 예약 작성</option>
          <option value="reserve-complete">07 예약 완료</option>
          <option value="my-reservations">08 내 예약</option>
          <option value="reservation-detail">09 예약 상세·취소</option>
        </optgroup>
        <optgroup label="관리자 화면">
          <option value="admin-login">10 관리자 로그인</option>
          <option value="admin-dashboard">11 관리자 대시보드</option>
          <option value="admin-popups">12 팝업 관리</option>
          <option value="admin-popup-form">13 팝업 등록·수정</option>
          <option value="admin-slots">14 회차·정원 관리</option>
          <option value="admin-reservations">15 예약 관리</option>
          <option value="admin-reservation-detail">16 관리자 예약 상세</option>
          <option value="admin-debug">17 운영 테스트</option>
        </optgroup>
      </select>
      <span class="prototype-meta">반응형 · 키보드 탐색 지원</span>
    </aside>
    <main id="app" tabindex="-1"></main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
