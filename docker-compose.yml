# Local development only. Next.js runs on the host with `npm run web:dev`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: popspot
      POSTGRES_USER: popspot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popspot_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popspot -d popspot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DB_URL: jdbc:postgresql://db:5432/popspot
      DB_USERNAME: popspot
      DB_PASSWORD: ${POSTGRES_PASSWORD:-popspot_local}
      DB_POOL_SIZE: "10" # local Postgres has no client cap
      AUTH_ISSUER: ${AUTH_ISSUER:-popspot-dev}
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
      FLYWAY_OUT_OF_ORDER: "true"
      # Local SANDBOX only; never enable where real customers are served.
      OPS_TESTS_ENABLED: "true"
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      DEV_AUTH_ISSUER: ${DEV_AUTH_ISSUER:-}
      DEV_AUTH_JWT_SECRET: ${DEV_AUTH_JWT_SECRET:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
